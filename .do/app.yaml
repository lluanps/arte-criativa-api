name: arte-criativa-api
region: nyc

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: lluanps/arte-criativa-api
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      # Preencha estes 4 como "secret" na tela de criação do app (não ficam no repo).
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      # Estes dois podem ficar como valor comum, não são segredo.
      - key: JWT_EXPIRATION_MINUTES
        scope: RUN_TIME
        value: "1440"
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: "https://arte-criativa-web.vercel.app,http://localhost:3000"
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: "https://arte-criativa-web.vercel.app"
      - key: EMAIL_REMETENTE
        scope: RUN_TIME
        value: "Arte Criativa <onboarding@resend.dev>"
      # Preencha como "secret" quando tiver a API key do Resend (resend.com).
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET

server:
  port: 8080

spring:
  application:
    name: arte-criativa-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/arte_criativa}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    br.com.artecriativa: DEBUG

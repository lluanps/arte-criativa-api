server:
  port: 8080

spring:
  application:
    name: arte-criativa-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/arte_criativa}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Troque via env var em produção — precisa de pelo menos 256 bits (32+ caracteres).
    secret: ${JWT_SECRET:arte-criativa-dev-secret-troque-em-producao-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

logging:
  level:
    br.com.artecriativa: DEBUG
